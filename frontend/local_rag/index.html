<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 RAG 问答</title>
<style>
/* ===== 基础与变量 ===== */
:root{
  --bg:#0b0e14;
  --panel:#12161f;
  --panel-2:#171d29;
  --panel-3:#1d2433;
  --border:#232b3b;
  --border-2:#2c3750;
  --text:#e8ecf4;
  --text-2:#9aa6bd;
  --text-3:#6b7690;
  --accent:#38bdf8;
  --accent-deep:#0284c7;
  --accent-soft:rgba(56,189,248,.13);
  --success:#34d399;
  --success-soft:rgba(52,211,153,.12);
  --danger:#f87171;
  --danger-soft:rgba(248,113,113,.12);
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ===== 顶部栏 ===== */
.header{
  height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  background:rgba(18,22,31,.82);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  position:relative;z-index:10;
}
.brand{display:flex;align-items:center;gap:12px;}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
}
.logo svg{width:19px;height:19px;}
.brand h1{font-size:16px;font-weight:600;letter-spacing:.2px;}
.brand .sub{font-size:11px;color:var(--text-3);margin-top:1px;}
.badges{display:flex;gap:8px;align-items:center;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--text-2);
  background:var(--panel-2);border:1px solid var(--border);
  padding:4px 11px;border-radius:999px;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);}
.badge.ok .dot{background:var(--success);box-shadow:0 0 6px var(--success);}
.badge .dot{background:var(--accent);}
.badge .tag{color:var(--accent);font-weight:500;}

/* ===== 主体布局 ===== */
.layout{
  display:flex;height:calc(100vh - 60px);
}
.sidebar{
  width:292px;flex-shrink:0;
  padding:18px 16px;overflow-y:auto;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:14px;
}
.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
}
.panel-title{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;color:var(--text-2);
  letter-spacing:.4px;margin-bottom:12px;text-transform:uppercase;
}
.panel-title svg{width:14px;height:14px;color:var(--accent);}

/* 上传区 */
.upload-zone{
  border:1.5px dashed var(--border-2);
  border-radius:var(--radius-sm);
  padding:22px 14px;text-align:center;cursor:pointer;
  transition:all .18s ease;background:var(--panel-2);
}
.upload-zone:hover,.upload-zone.dragover{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.upload-zone .ic{
  width:38px;height:38px;margin:0 auto 10px;border-radius:10px;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
}
.upload-zone .ic svg{width:20px;height:20px;color:var(--accent);}
.upload-zone .main{font-size:13.5px;color:var(--text);font-weight:500;}
.upload-zone .hint{font-size:11.5px;color:var(--text-3);margin-top:3px;}
.upload-zone .formats{font-size:10.5px;color:var(--text-3);margin-top:8px;letter-spacing:.3px;}
#fileInput{display:none;}
#upTip{
  margin-top:10px;font-size:12.5px;color:var(--text-2);
  display:none;align-items:flex-start;gap:6px;line-height:1.5;
}
#upTip.show{display:flex;}
#upTip.ok{color:var(--success);}
#upTip.err{color:var(--danger);}
#upTip svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;}

/* 状态列表 */
.status-list{display:flex;flex-direction:column;gap:0;font-size:12.5px;}
.status-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px dashed var(--border);color:var(--text-2);
}
.status-row:last-child{border-bottom:none;}
.status-row .k{color:var(--text-3);}
.status-row .v{font-weight:500;color:var(--text);}
.status-row .v.ok{color:var(--success);}
.status-row .v.idle{color:var(--text-3);}

/* 操作按钮 */
.ops{display:flex;flex-direction:column;gap:9px;}
.op-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:11px 14px;border-radius:var(--radius-sm);
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);font-size:13px;transition:all .16s ease;text-align:left;
}
.op-btn:hover{border-color:var(--border-2);background:var(--panel-3);}
.op-btn .l{display:flex;align-items:center;gap:9px;}
.op-btn svg{width:15px;height:15px;color:var(--text-2);}
.op-btn.warn:hover{border-color:rgba(248,113,113,.45);}
.op-btn.warn svg{color:var(--danger);}
.op-btn.warn:hover svg{color:var(--danger);}

/* ===== 聊天主区 ===== */
.chat-main{
  flex:1;display:flex;flex-direction:column;min-width:0;position:relative;
}
.chat-scroll{
  flex:1;overflow-y:auto;padding:26px 0;
}
.chat-inner{
  max-width:760px;margin:0 auto;padding:0 26px;
  display:flex;flex-direction:column;gap:18px;
}
.msg{display:flex;gap:12px;max-width:86%;animation:fadeUp .25s ease;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.avatar{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.msg.assistant .avatar{background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 3px 10px rgba(14,165,233,.3);}
.msg.user .avatar{background:var(--panel-3);border:1px solid var(--border-2);}
.avatar svg{width:16px;height:16px;}

.bubble{
  padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.7;
  white-space:normal;word-break:break-word;overflow-wrap:anywhere;
}
.msg.assistant .bubble{
  background:var(--panel-2);border:1px solid var(--border);
  border-top-left-radius:4px;color:var(--text);
}
.msg.user .bubble{
  background:linear-gradient(135deg,#0ea5e9,#0284c7);
  border-top-right-radius:4px;color:#fff;
  box-shadow:0 4px 14px rgba(14,165,233,.25);
}
.bubble p{margin:0 0 8px;}
.bubble p:last-child{margin-bottom:0;}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{font-size:14px;font-weight:600;margin:10px 0 6px;}
.bubble ul,.bubble ol{margin:6px 0 8px;padding-left:20px;}
.bubble li{margin:3px 0;}
.bubble code{
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;
  background:rgba(56,189,248,.12);color:#7dd3fc;
  padding:1px 6px;border-radius:5px;
}
.bubble pre{
  background:#0d1117;border:1px solid var(--border);
  border-radius:9px;padding:12px 14px;overflow-x:auto;margin:8px 0;
}
.bubble pre code{background:none;padding:0;color:#c9d4e8;font-size:12.5px;line-height:1.6;}
.bubble blockquote{
  border-left:3px solid var(--accent);padding:2px 12px;margin:8px 0;
  color:var(--text-2);background:var(--panel-3);border-radius:0 7px 7px 0;
}
.bubble a{color:var(--accent);text-decoration:none;}
.bubble a:hover{text-decoration:underline;}

/* 来源折叠 */
.sources{
  margin-top:10px;border-top:1px dashed var(--border);
  padding-top:9px;
}
.sources details{
  font-size:12px;color:var(--text-2);
}
.sources summary{
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  color:var(--accent);user-select:none;font-size:12px;
}
.sources summary svg{width:12px;height:12px;transition:transform .2s;}
.sources details[open] summary svg{transform:rotate(90deg);}
.src-item{
  margin-top:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:8px 11px;font-size:12px;color:var(--text-2);
  line-height:1.6;max-height:110px;overflow-y:auto;
}
.src-item .meta{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:10.5px;margin-bottom:3px;}
.src-item .meta svg{width:11px;height:11px;color:var(--accent);}

/* 打字动画 */
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px;}
.typing i{
  width:6px;height:6px;border-radius:50%;background:var(--text-3);
  animation:blink 1.2s infinite ease-in-out;
}
.typing i:nth-child(2){animation-delay:.18s;}
.typing i:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

/* 空状态 */
.empty{
  align-self:center;text-align:center;padding:60px 20px;color:var(--text-3);
}
.empty .eic{
  width:56px;height:56px;margin:0 auto 16px;border-radius:16px;
  background:var(--panel-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
}
.empty .eic svg{width:26px;height:26px;color:var(--accent);opacity:.8;}
.empty .t{font-size:14px;color:var(--text-2);font-weight:500;}
.empty .d{font-size:12px;margin-top:6px;}

/* 输入区 */
.input-area{
  border-top:1px solid var(--border);
  background:rgba(18,22,31,.85);backdrop-filter:blur(12px);
  padding:16px 26px 20px;
}
.input-wrap{
  max-width:760px;margin:0 auto;
  background:var(--panel-2);border:1px solid var(--border-2);
  border-radius:14px;display:flex;align-items:flex-end;gap:10px;
  padding:9px 9px 9px 16px;transition:border-color .2s;
}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
#qInput{
  flex:1;background:transparent;border:none;outline:none;resize:none;
  color:var(--text);font-size:14px;line-height:1.6;font-family:inherit;
  max-height:140px;min-height:24px;padding:4px 0;
}
#qInput::placeholder{color:var(--text-3);}
.send-btn{
  width:38px;height:38px;flex-shrink:0;border-radius:10px;
  background:linear-gradient(135deg,#0ea5e9,#0284c7);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s ease;box-shadow:0 3px 10px rgba(14,165,233,.3);
}
.send-btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
.send-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
.send-btn svg{width:17px;height:17px;color:#fff;}
.input-hint{
  max-width:760px;margin:8px auto 0;font-size:11px;color:var(--text-3);
  display:flex;justify-content:space-between;
}

/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);}

/* ===== 响应式 ===== */
@media (max-width:980px){
  .sidebar{width:250px;}
  .badge .lbl{display:none;}
}
@media (max-width:760px){
  body{overflow:auto;}
  .layout{flex-direction:column;height:auto;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:none;}
  .chat-main{height:calc(100vh - 200px);min-height:480px;}
  .msg{max-width:94%;}
  .chat-inner{padding:0 14px;}
  .input-area{padding:12px 14px 16px;}
  .header{padding:0 14px;}
}
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header class="header">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
        <circle cx="12" cy="12" r="4"/>
      </svg>
    </div>
    <div>
      <h1>知识库 RAG 问答</h1>
      <div class="sub">基于向量检索的知识增强对话</div>
    </div>
  </div>
  <div class="badges">
    <span class="badge"><span class="dot"></span>模型 <span class="tag" id="bdModel">加载中</span></span>
    <span class="badge ok"><span class="dot"></span>知识库 <span class="tag" id="bdKb">检测中</span></span>
    <span class="badge"><span class="dot"></span>会话 <span class="tag" id="bdSess">-</span></span>
  </div>
</header>

<!-- ===== 主体 ===== -->
<div class="layout">

  <!-- 左侧面板 -->
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        上传文档入库
      </div>
      <div class="upload-zone" id="uploadZone">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </div>
        <div class="main">点击选择或拖拽文件</div>
        <div class="hint">支持 TXT / PDF / DOCX / MD / CSV</div>
        <div class="formats">上传后自动切片并建立向量索引</div>
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.csv">
      </div>
      <div id="upTip"></div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        运行状态
      </div>
      <div class="status-list" id="statusList">
        <div class="status-row"><span class="k">对话模型</span><span class="v" id="stModel">-</span></div>
        <div class="status-row"><span class="k">向量模型</span><span class="v idle" id="stEmb">-</span></div>
        <div class="status-row"><span class="k">向量索引</span><span class="v" id="stIdx">-</span></div>
        <div class="status-row"><span class="k">API 配置</span><span class="v" id="stApi">-</span></div>
        <div class="status-row"><span class="k">活动会话</span><span class="v" id="stSess">-</span></div>
        <div class="status-row"><span class="k">智能体</span><span class="v idle" id="stAgents">-</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        会话管理
      </div>
      <div class="ops">
        <button class="op-btn" onclick="clearHistory()">
          <span class="l">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            清空对话记忆
          </span>
          <span style="font-size:10.5px;color:var(--text-3)">不删知识库</span>
        </button>
        <button class="op-btn warn" onclick="resetKB()">
          <span class="l">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            清空知识库
          </span>
          <span style="font-size:10.5px;color:var(--text-3)">不可恢复</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- 聊天主区 -->
  <main class="chat-main">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatBox">
        <div class="empty" id="emptyState">
          <div class="eic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="t">向知识库提问，开始对话</div>
          <div class="d">回答会基于已上传的文档内容生成，并标注参考来源</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="qInput" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行…"></textarea>
        <button class="send-btn" id="sendBtn" onclick="askQ()" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-hint">
        <span>RAG 模式 · 自动检索知识库</span>
        <span id="modelHint"></span>
      </div>
    </div>
  </main>
</div>

<script>
/* ===== 工具函数 ===== */
const $ = (id) => document.getElementById(id);
const baseUrl = "/api";
const sessionId = localStorage.getItem("rag_session_id") || (() => {
  const id = "s_" + Math.random().toString(36).slice(2);
  localStorage.setItem("rag_session_id", id);
  return id;
})();

/* 轻量 Markdown 渲染（安全转义后处理常用语法） */
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function renderMarkdown(text){
  let html = escapeHtml(text);

  // 代码块
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    return "<pre><code>" + code.replace(/^\n/,"") + "</code></pre>";
  });
  // 行内代码
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // 标题
  html = html.replace(/^###\s+(.+)$/gm, "<h4>$1</h4>");
  html = html.replace(/^##\s+(.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^#\s+(.+)$/gm, "<h2>$1</h2>");
  // 引用
  html = html.replace(/^&gt;\s?(.+)$/gm, "<blockquote>$1</blockquote>");
  // 无序列表
  html = html.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, function(m){
    if((m.match(/<li>/g)||[]).length >= 2) return "<ul>" + m + "</ul>";
    return m;
  });
  // 加粗
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // 斜体
  html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  // 链接
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 换行
  html = html.replace(/\n{2,}/g, "\n\n").replace(/([^\n])\n(?!\n)/g, "$1<br>");

  return html;
}

/* ===== 聊天 ===== */
const chatBox = $("chatBox");
const chatScroll = $("chatScroll");

function appendMsg(role, text, sources){
  $("emptyState") && $("emptyState").remove();
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.innerHTML = role === "assistant"
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#9aa6bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if(role === "assistant" && typeof text === "string"){
    bubble.innerHTML = renderMarkdown(text);
  }else{
    bubble.textContent = text;
  }

  if(sources && sources.length){
    const srcWrap = document.createElement("div");
    srcWrap.className = "sources";
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
      "参考了知识库中 " + sources.length + " 段内容";
    details.appendChild(summary);
    sources.forEach((s, i) => {
      const item = document.createElement("div");
      item.className = "src-item";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
        "片段 " + (i + 1) + (s.metadata && s.metadata.source ? " · " + s.metadata.source : "");
      const content = document.createElement("div");
      content.textContent = (s.content || "").slice(0, 260) + ((s.content || "").length > 260 ? "…" : "");
      item.appendChild(meta);
      item.appendChild(content);
      details.appendChild(item);
    });
    srcWrap.appendChild(details);
    bubble.appendChild(srcWrap);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatBox.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function showTyping(){
  $("emptyState") && $("emptyState").remove();
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.id = "typingMsg";
  wrap.innerHTML = '<div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg></div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chatBox.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function hideTyping(){ const t = $("typingMsg"); t && t.remove(); }

/* ===== 上传 ===== */
async function uploadFile(){
  const dom = $("fileInput");
  const tip = $("upTip");
  if(!dom.files[0]){
    showTip(tip, "请先选择文档", false);
    return;
  }
  const fd = new FormData();
  fd.append("file", dom.files[0]);
  try{
    const res = await fetch(baseUrl + "/upload", {method:"POST", body:fd});
    const d = await res.json();
    if(res.ok){
      showTip(tip, "文档入库成功：" + d.filename + "（共 " + d.chunk_count + " 段）", true);
      loadStatus();
    }else{
      showTip(tip, d.detail || "上传失败", false);
    }
  }catch(e){
    showTip(tip, "接口连接失败", false);
  }
}
function showTip(el, text, ok){
  el.className = "show " + (ok ? "ok" : "err");
  el.innerHTML = (ok
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>') + "<span>" + text + "</span>";
}

/* 拖拽上传 */
const uploadZone = $("uploadZone");
uploadZone.addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", uploadFile);
["dragover","dragenter"].forEach(ev => uploadZone.addEventListener(ev, e => {
  e.preventDefault(); uploadZone.classList.add("dragover");
}));
["dragleave","drop"].forEach(ev => uploadZone.addEventListener(ev, e => {
  e.preventDefault(); uploadZone.classList.remove("dragover");
}));
uploadZone.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if(f){
    const dt = new DataTransfer();
    dt.items.add(f);
    $("fileInput").files = dt.files;
    uploadFile();
  }
});

/* ===== 问答 ===== */
async function askQ(){
  const input = $("qInput");
  const sendBtn = $("sendBtn");
  const q = input.value.trim();
  if(!q) return;
  appendMsg("user", q);
  input.value = "";
  autoGrow();
  sendBtn.disabled = true;
  showTyping();
  try{
    const res = await fetch(baseUrl + "/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q, session_id:sessionId})
    });
    const json = await res.json();
    hideTyping();
    if(res.ok){
      appendMsg("assistant", json.answer, json.sources);
    }else{
      appendMsg("assistant", "请求失败：" + (json.detail || "未知错误"));
    }
  }catch(e){
    hideTyping();
    appendMsg("assistant", "接口连接失败，请确认服务已启动");
  }
  sendBtn.disabled = false;
  input.focus();
}

/* 输入框 */
const qInput = $("qInput");
function autoGrow(){
  qInput.style.height = "auto";
  qInput.style.height = Math.min(qInput.scrollHeight, 140) + "px";
}
qInput.addEventListener("input", autoGrow);
qInput.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    askQ();
  }
});

/* ===== 管理操作 ===== */
async function resetKB(){
  if(!confirm("确定清空全部知识库文档？此操作不可恢复！")) return;
  try{
    const res = await fetch(baseUrl + "/reset", {method:"DELETE"});
    const d = await res.json();
    alert(d.message || "知识库已清空");
    loadStatus();
  }catch(e){ alert("接口连接失败"); }
}

async function clearHistory(){
  try{
    await fetch(baseUrl + "/clear_history", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:sessionId})
    });
  }catch(e){}
  chatBox.innerHTML = "";
  appendMsg("assistant", "对话记忆已清空，我们重新开始吧");
}

/* ===== 状态加载 ===== */
async function loadStatus(){
  try{
    const res = await fetch(baseUrl + "/status");
    const d = await res.json();
    $("bdModel").textContent = d.chat_model || "-";
    $("bdKb").textContent = d.vector_store_ready ? "就绪" : "未就绪";
    $("bdSess").textContent = d.active_sessions != null ? d.active_sessions : "-";
    $("stModel").textContent = d.chat_model || "-";
    $("stEmb").textContent = (d.embedding_model || "-").split("/").pop();
    const idx = $("stIdx");
    idx.textContent = d.vector_store_ready ? "已就绪" : "未初始化";
    idx.className = "v " + (d.vector_store_ready ? "ok" : "idle");
    const api = $("stApi");
    api.textContent = d.dashscope_configured ? "已配置" : "未配置";
    api.className = "v " + (d.dashscope_configured ? "ok" : "idle");
    $("stSess").textContent = d.active_sessions != null ? d.active_sessions : "-";
    $("stAgents").textContent = Array.isArray(d.agents) ? d.agents.join(" · ") : "-";
    $("modelHint").textContent = "当前模型 " + (d.chat_model || "-");
  }catch(e){
    $("bdModel").textContent = "连接失败";
    $("bdKb").textContent = "未知";
  }
}

/* ===== 初始化 ===== */
loadStatus();
setInterval(loadStatus, 15000);
autoGrow();
</script>
