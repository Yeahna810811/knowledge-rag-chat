name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r frontend/local_rag/requirements.txt
      - name: Import app module
        run: python -c "from frontend.local_rag.app import create_app; create_app(); print('ok')"
        env:
          DASHSCOPE_API_KEY: dummy-for-import

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build Vue app
        working-directory: frontend/web
        run: |
          npm install
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-smoke, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t knowledge-rag-chat:ci .
